<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>牧場インフォメーション</title>

<!-- PWAマニフェスト（このファイルはGitHub Pages上に固定で置かれているので、
     Google Apps Scriptのように毎回URLが変わってしまう問題が起きない） -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4a7c59">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">

<!-- iOS Safariでホーム画面に追加した際に、アドレスバー無しの全画面表示にする -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="牧場インフォメーション">

<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #f6f5f2;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif;
  }
  #app-frame {
    border: none;
    width: 100%;
    height: 100vh;
    display: block;
  }
  .loading {
    position: fixed;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #6b6b66;
    background: #f6f5f2;
  }
  .loading img {
    width: 64px;
    height: 64px;
    border-radius: 14px;
    margin-bottom: 12px;
  }
  .loading p {
    font-size: 13px;
    margin: 0;
  }
</style>
</head>
<body>

<!-- 読み込み中表示。iframeのGASページが読み込み完了したら非表示にする -->
<div class="loading" id="loadingScreen">
  <img src="icon-192.png" alt="">
  <p>読み込み中…</p>
</div>

<!-- GAS Web Appをこのページ（GitHub Pages、固定URL）の中にiframeで埋め込んで表示する。
     これにより、アドレスバーは常に mhansyokub-design.github.io のままになり、
     「ホーム画面に追加」時にこのページのmanifest.json・アイコンが正しく参照される。 -->
<iframe id="app-frame" src="GAS_WEBAPP_URL_PLACEHOLDER" title="牧場インフォメーション"></iframe>

<script>
  // GAS Web AppのURL。デプロイ更新で変わった場合は1箇所だけ書き換えればよい。
  var GAS_WEBAPP_URL = 'https://script.google.com/macros/s/AKfycbwGw4MZQiDA3jJqslfrvRBSbSOEblW09VXhJfy4yZxr6YFEsTS-OkyxReD4uNk7Midjjg/exec';

  var iframeEl = document.getElementById('app-frame');
  iframeEl.src = GAS_WEBAPP_URL;

  iframeEl.addEventListener('load', function () {
    var loadingEl = document.getElementById('loadingScreen');
    if (loadingEl) loadingEl.style.display = 'none';
  });
</script>

</body>
</html>
